<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Mode Palette Preview — POS</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #050810;
        color: #e2e8f0;
        min-height: 100vh;
        padding: 32px 24px 64px;
    }

    .page-header {
        text-align: center;
        max-width: 900px;
        margin: 0 auto 40px;
    }
    .page-header h1 {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .page-header p {
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.6;
    }
    .page-header kbd {
        background: #1e293b;
        border: 1px solid #334155;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-family: monospace;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 24px;
        max-width: 2200px;
        margin: 0 auto;
    }

    .palette-card {
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.06);
        background: #0d1117;
        transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        cursor: pointer;
        position: relative;
    }
    .palette-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        border-color: rgba(255,255,255,0.15);
    }

    .palette-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        background: rgba(15, 23, 42, 0.5);
    }
    .palette-label-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .palette-name {
        font-size: 15px;
        font-weight: 700;
        color: #f8fafc;
    }
    .palette-tagline {
        font-size: 11px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }
    .swatch-row {
        display: flex;
        gap: 4px;
    }
    .swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.15);
    }
    .expand-hint {
        font-size: 10px;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    /* Mini dashboard mockup */
    .mock {
        display: flex;
        flex-direction: column;
        min-height: 420px;
        font-size: 11px;
    }
    .mock-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
    }
    .mock-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-primary);
    }
    .mock-logo-dot {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: var(--accent);
        display: grid;
        place-items: center;
        color: white;
        font-size: 10px;
        font-weight: 800;
    }
    .mock-nav-right {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .mock-icon {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--soft);
        display: grid;
        place-items: center;
        color: var(--text-secondary);
        font-size: 10px;
    }
    .mock-avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--accent);
        color: white;
        display: grid;
        place-items: center;
        font-size: 9px;
        font-weight: 700;
    }

    .mock-body {
        display: flex;
        flex: 1;
    }
    .mock-sidebar {
        width: 92px;
        padding: 10px 6px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .mock-nav-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 6px;
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 500;
    }
    .mock-nav-item.active {
        background: var(--accent-soft);
        color: var(--accent-light);
    }
    .mock-nav-item .dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: currentColor;
        opacity: 0.6;
    }

    .mock-content {
        flex: 1;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--content-bg);
    }
    .mock-page-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-primary);
    }
    .mock-page-sub {
        font-size: 10px;
        color: var(--text-secondary);
        margin-top: 2px;
    }

    .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
    }
    .kpi {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        position: relative;
        overflow: hidden;
    }
    .kpi::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: var(--kpi-strip, var(--accent));
    }
    .kpi-label {
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }
    .kpi-value {
        font-size: 16px;
        font-weight: 800;
        color: var(--text-primary);
        letter-spacing: -0.02em;
    }
    .kpi-delta {
        display: inline-block;
        font-size: 9px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--accent-soft);
        color: var(--accent-light);
        margin-top: 4px;
    }

    .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
    }
    .panel-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 8px;
    }

    /* Tiny chart */
    .chart {
        height: 60px;
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: 4px;
        padding-top: 4px;
    }
    .chart-bar {
        flex: 1;
        border-radius: 3px 3px 0 0;
        background: var(--accent);
        opacity: 0.85;
        transition: opacity 0.2s;
    }
    .chart-bar:hover { opacity: 1; }

    /* Activity list */
    .activity-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 4px;
        border-radius: 6px;
    }
    .activity-item:hover { background: var(--soft); }
    .activity-icon {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--accent-soft);
        color: var(--accent-light);
        display: grid;
        place-items: center;
        font-size: 10px;
        flex-shrink: 0;
    }
    .activity-text {
        flex: 1;
        color: var(--text-primary);
        font-size: 10px;
    }
    .activity-text strong { color: var(--text-primary); }
    .activity-time {
        font-size: 9px;
        color: var(--text-secondary);
    }

    /* Badges row */
    .badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 4px;
    }
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 600;
        border: 1px solid transparent;
    }
    .badge-success {
        background: var(--accent-soft);
        color: var(--accent-light);
        border-color: var(--accent-border);
    }
    .badge-info {
        background: rgba(59, 130, 246, 0.12);
        color: #60a5fa;
        border-color: rgba(59, 130, 246, 0.25);
    }
    .badge-danger {
        background: rgba(239, 68, 68, 0.12);
        color: #f87171;
        border-color: rgba(239, 68, 68, 0.25);
    }

    /* Buttons */
    .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 4px;
    }
    .btn-primary {
        background: var(--accent);
        color: white;
        border: none;
        padding: 7px 14px;
        border-radius: 7px;
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-secondary {
        background: var(--soft);
        color: var(--text-primary);
        border: 1px solid var(--border);
        padding: 7px 14px;
        border-radius: 7px;
        font-size: 10px;
        font-weight: 500;
        cursor: pointer;
    }

    /* Fullscreen expanded view */
    body.expanded .grid {
        display: none;
    }
    body.expanded .page-header {
        display: none;
    }
    .fullscreen-view {
        display: none;
        max-width: 1400px;
        margin: 0 auto;
    }
    body.expanded .fullscreen-view {
        display: block;
    }
    .fullscreen-view .palette-card {
        cursor: default;
    }
    .fullscreen-view .palette-card:hover {
        transform: none;
    }
    .fullscreen-view .mock {
        min-height: 700px;
        font-size: 14px;
    }
    .fullscreen-view .mock-logo { font-size: 15px; }
    .fullscreen-view .mock-logo-dot { width: 30px; height: 30px; font-size: 14px; }
    .fullscreen-view .mock-sidebar { width: 180px; padding: 18px 12px; }
    .fullscreen-view .mock-nav-item { padding: 10px 12px; font-size: 13px; }
    .fullscreen-view .mock-nav-item .dot { width: 14px; height: 14px; }
    .fullscreen-view .mock-content { padding: 24px; gap: 18px; }
    .fullscreen-view .mock-page-title { font-size: 22px; }
    .fullscreen-view .mock-page-sub { font-size: 13px; }
    .fullscreen-view .kpi { padding: 18px; border-radius: 14px; }
    .fullscreen-view .kpi-label { font-size: 11px; }
    .fullscreen-view .kpi-value { font-size: 32px; }
    .fullscreen-view .kpi-delta { font-size: 12px; padding: 3px 10px; }
    .fullscreen-view .panel { padding: 20px; border-radius: 14px; }
    .fullscreen-view .panel-title { font-size: 16px; margin-bottom: 14px; }
    .fullscreen-view .chart { height: 140px; gap: 8px; }
    .fullscreen-view .activity-item { padding: 12px 8px; }
    .fullscreen-view .activity-icon { width: 38px; height: 38px; font-size: 16px; border-radius: 10px; }
    .fullscreen-view .activity-text { font-size: 14px; }
    .fullscreen-view .activity-time { font-size: 12px; }
    .fullscreen-view .badge { font-size: 12px; padding: 5px 12px; }
    .fullscreen-view .btn-primary,
    .fullscreen-view .btn-secondary { padding: 10px 20px; font-size: 14px; }

    .back-btn {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
        padding: 10px 18px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        color: #e2e8f0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
    }
    .back-btn:hover { background: #334155; }
    body.expanded .back-btn { display: block; }

    .verdict {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }
    .verdict.top-pick {
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
        border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .verdict.safe {
        background: rgba(148, 163, 184, 0.12);
        color: #cbd5e1;
        border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .verdict.loud {
        background: rgba(239, 68, 68, 0.12);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.25);
    }
</style>
</head>
<body>

<button class="back-btn" onclick="document.body.classList.remove('expanded')">← Back to all</button>

<div class="page-header">
    <h1>Dark Mode Palette Preview</h1>
    <p>Five candidates side-by-side. <kbd>Click any card</kbd> to expand it full-width for a closer look.</p>
</div>

<div class="grid" id="grid"></div>
<div class="fullscreen-view" id="fullscreen"></div>

<script>
    const palettes = [
        {
            id: 'current',
            name: 'Current — Emerald Green',
            tagline: 'Baseline',
            verdict: 'Safe',
            verdictClass: 'safe',
            bg: '#111827',
            contentBg: 'transparent',
            surface: 'rgba(30, 41, 59, 0.65)',
            border: 'rgba(255, 255, 255, 0.08)',
            soft: 'rgba(255, 255, 255, 0.06)',
            accent: '#16a34a',
            accentHover: '#15803d',
            accentLight: '#4ade80',
            accentSoft: 'rgba(22, 163, 74, 0.15)',
            accentBorder: 'rgba(22, 163, 74, 0.35)',
            textPrimary: '#f8fafc',
            textSecondary: '#cbd5e1',
            swatches: ['#16a34a', '#15803d', '#4ade80', '#0f172a']
        },
        {
            id: 'teal',
            name: 'Deep Teal',
            tagline: 'Modern · Industrial',
            verdict: 'Top Pick',
            verdictClass: 'top-pick',
            bg: '#0b1220',
            contentBg: 'transparent',
            surface: 'rgba(20, 32, 46, 0.72)',
            border: 'rgba(94, 234, 212, 0.12)',
            soft: 'rgba(94, 234, 212, 0.06)',
            accent: '#0d9488',
            accentHover: '#0f766e',
            accentLight: '#5eead4',
            accentSoft: 'rgba(13, 148, 136, 0.18)',
            accentBorder: 'rgba(94, 234, 212, 0.35)',
            textPrimary: '#f0fdfa',
            textSecondary: '#94a3b8',
            swatches: ['#0d9488', '#0f766e', '#5eead4', '#0b1220']
        },
        {
            id: 'indigo',
            name: 'Indigo / Blue',
            tagline: 'Corporate · Trustworthy',
            verdict: 'Safe',
            verdictClass: 'safe',
            bg: '#0b1027',
            contentBg: 'transparent',
            surface: 'rgba(24, 30, 58, 0.72)',
            border: 'rgba(165, 180, 252, 0.14)',
            soft: 'rgba(165, 180, 252, 0.07)',
            accent: '#4f46e5',
            accentHover: '#4338ca',
            accentLight: '#a5b4fc',
            accentSoft: 'rgba(79, 70, 229, 0.18)',
            accentBorder: 'rgba(165, 180, 252, 0.35)',
            textPrimary: '#eef2ff',
            textSecondary: '#94a3b8',
            swatches: ['#4f46e5', '#4338ca', '#a5b4fc', '#0b1027']
        },
        {
            id: 'violet',
            name: 'Violet / Purple',
            tagline: 'Modern · Premium',
            verdict: 'Safe',
            verdictClass: 'safe',
            bg: '#140f24',
            contentBg: 'transparent',
            surface: 'rgba(38, 27, 60, 0.68)',
            border: 'rgba(196, 181, 253, 0.14)',
            soft: 'rgba(196, 181, 253, 0.07)',
            accent: '#8b5cf6',
            accentHover: '#7c3aed',
            accentLight: '#c4b5fd',
            accentSoft: 'rgba(139, 92, 246, 0.18)',
            accentBorder: 'rgba(196, 181, 253, 0.35)',
            textPrimary: '#f5f3ff',
            textSecondary: '#94a3b8',
            swatches: ['#8b5cf6', '#7c3aed', '#c4b5fd', '#140f24']
        },
        {
            id: 'amber',
            name: 'Amber / Warm',
            tagline: 'Retail · Welcoming',
            verdict: 'Top Pick',
            verdictClass: 'top-pick',
            bg: '#1c1206',
            contentBg: 'transparent',
            surface: 'rgba(48, 32, 16, 0.68)',
            border: 'rgba(251, 191, 36, 0.14)',
            soft: 'rgba(251, 191, 36, 0.06)',
            accent: '#f59e0b',
            accentHover: '#d97706',
            accentLight: '#fbbf24',
            accentSoft: 'rgba(245, 158, 11, 0.18)',
            accentBorder: 'rgba(251, 191, 36, 0.35)',
            textPrimary: '#fffbeb',
            textSecondary: '#a8a29e',
            swatches: ['#f59e0b', '#d97706', '#fbbf24', '#1c1206']
        },
        {
            id: 'cyan',
            name: 'Cyan / Sky',
            tagline: 'Fresh · Technical',
            verdict: 'Loud',
            verdictClass: 'loud',
            bg: '#061826',
            contentBg: 'transparent',
            surface: 'rgba(14, 38, 58, 0.72)',
            border: 'rgba(103, 232, 249, 0.14)',
            soft: 'rgba(103, 232, 249, 0.06)',
            accent: '#06b6d4',
            accentHover: '#0891b2',
            accentLight: '#67e8f9',
            accentSoft: 'rgba(6, 182, 212, 0.18)',
            accentBorder: 'rgba(103, 232, 249, 0.35)',
            textPrimary: '#ecfeff',
            textSecondary: '#94a3b8',
            swatches: ['#06b6d4', '#0891b2', '#67e8f9', '#061826']
        }
    ];

    const kpiStrips = ['#16a34a', '#3b82f6', '#f59e0b', '#a855f7'];

    function mockHTML(p) {
        const stripFor = (i) => i === 0 ? p.accent : kpiStrips[i];
        const chartBars = [40, 65, 30, 80, 55, 90, 45, 70, 60, 85, 50, 75];
        return `
        <div class="mock" style="
            --accent: ${p.accent};
            --accent-hover: ${p.accentHover};
            --accent-light: ${p.accentLight};
            --accent-soft: ${p.accentSoft};
            --accent-border: ${p.accentBorder};
            --surface: ${p.surface};
            --border: ${p.border};
            --soft: ${p.soft};
            --text-primary: ${p.textPrimary};
            --text-secondary: ${p.textSecondary};
            --content-bg: ${p.contentBg};
            background: ${p.bg};
        ">
            <div class="mock-nav">
                <div class="mock-logo">
                    <div class="mock-logo-dot">K</div>
                    <span>Kirby's POS</span>
                </div>
                <div class="mock-nav-right">
                    <div class="mock-icon">☀</div>
                    <div class="mock-icon">🔔</div>
                    <div class="mock-avatar">JD</div>
                </div>
            </div>
            <div class="mock-body">
                <div class="mock-sidebar">
                    <div class="mock-nav-item active"><span class="dot"></span>Overview</div>
                    <div class="mock-nav-item"><span class="dot"></span>POS</div>
                    <div class="mock-nav-item"><span class="dot"></span>Inventory</div>
                    <div class="mock-nav-item"><span class="dot"></span>Orders</div>
                    <div class="mock-nav-item"><span class="dot"></span>Reports</div>
                    <div class="mock-nav-item"><span class="dot"></span>Settings</div>
                </div>
                <div class="mock-content">
                    <div>
                        <div class="mock-page-title">Dashboard Overview</div>
                        <div class="mock-page-sub">Welcome back, Juan!</div>
                    </div>

                    <div class="kpi-grid">
                        <div class="kpi" style="--kpi-strip: ${stripFor(0)}">
                            <div class="kpi-label">Today's Sales</div>
                            <div class="kpi-value">₱12,480</div>
                            <span class="kpi-delta">↗ +8.2%</span>
                        </div>
                        <div class="kpi" style="--kpi-strip: ${stripFor(1)}">
                            <div class="kpi-label">Orders</div>
                            <div class="kpi-value">47</div>
                            <span class="kpi-delta">↗ +3.4%</span>
                        </div>
                        <div class="kpi" style="--kpi-strip: ${stripFor(2)}">
                            <div class="kpi-label">Products</div>
                            <div class="kpi-value">218</div>
                            <span class="kpi-delta">↗ +12</span>
                        </div>
                        <div class="kpi" style="--kpi-strip: ${stripFor(3)}">
                            <div class="kpi-label">Customers</div>
                            <div class="kpi-value">96</div>
                            <span class="kpi-delta">↗ +5</span>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-title">Sales Overview</div>
                        <div class="chart">
                            ${chartBars.map(h => `<div class="chart-bar" style="height:${h}%"></div>`).join('')}
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-title">Recent Activity</div>
                        <div class="activity-item">
                            <div class="activity-icon">🛒</div>
                            <div class="activity-text"><strong>Juan</strong> · Sale REC-0451 · ₱1,240</div>
                            <div class="activity-time">2 min ago</div>
                        </div>
                        <div class="activity-item">
                            <div class="activity-icon">📦</div>
                            <div class="activity-text"><strong>Maria</strong> · Added product "Steel Nails"</div>
                            <div class="activity-time">14 min ago</div>
                        </div>
                        <div class="activity-item">
                            <div class="activity-icon">👤</div>
                            <div class="activity-text"><strong>Pedro</strong> · New customer registered</div>
                            <div class="activity-time">1 hr ago</div>
                        </div>
                    </div>

                    <div class="badges">
                        <span class="badge badge-success">● In Stock</span>
                        <span class="badge badge-info">● Info</span>
                        <span class="badge badge-danger">● Low Stock</span>
                    </div>

                    <div class="btn-row">
                        <button class="btn-primary">Process Payment</button>
                        <button class="btn-secondary">Export CSV</button>
                    </div>
                </div>
            </div>
        </div>`;
    }

    function renderCard(p) {
        return `
        <div class="palette-card" onclick="expand('${p.id}')">
            <div class="palette-label">
                <div class="palette-label-left">
                    <div>
                        <div class="palette-name">${p.name}</div>
                        <div class="palette-tagline">${p.tagline}</div>
                    </div>
                    <span class="verdict ${p.verdictClass}">${p.verdict}</span>
                </div>
                <div class="swatch-row">
                    ${p.swatches.map(c => `<div class="swatch" style="background:${c}"></div>`).join('')}
                </div>
            </div>
            ${mockHTML(p)}
        </div>`;
    }

    document.getElementById('grid').innerHTML = palettes.map(renderCard).join('');

    function expand(id) {
        const p = palettes.find(x => x.id === id);
        document.getElementById('fullscreen').innerHTML = renderCard(p);
        document.body.classList.add('expanded');
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>

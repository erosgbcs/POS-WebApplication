            line.className = cls;

            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;

                    try {
                        const fb = await window.POS_SUPABASE.getFirebase();
                        if (fb) {
                            log('Firebase ready.', 'ok');
                            seedBtn.disabled = false;
                            wipeBtn.disabled = false;
                            return;
                        }
                    } catch (e) {
                        // keep waiting
                    }
                }
                await new Promise(r => setTimeout(r, 200));

            log('Firebase failed to load after 6 seconds.', 'err');
            log('Make sure firebase.js exists at the same folder level as seed.html.', 'err');

                log('Deleted ' + snap.docs.length + ' items.', 'ok');
